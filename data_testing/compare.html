<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문단 분할 비교 뷰어</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background: #0f0f13;
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 20px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        .header h1 span {
            background: linear-gradient(90deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .controls select {
            background: #1e1e2e;
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            font-family: inherit;
            min-width: 350px;
            cursor: pointer;
        }

        .controls select:hover {
            border-color: #6366f1;
        }

        .stats-badge {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        /* Legend */
        .legend {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-left: auto;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #999;
        }

        .legend-dot {
            width: 12px;
            height: 3px;
            border-radius: 2px;
        }

        .legend-dot.split {
            background: #f43f5e;
        }

        .legend-dot.heading {
            background: #6366f1;
        }

        /* Content area */
        .content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px;
        }

        /* Item card */
        .item-card {
            background: #1a1a24;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .item-header {
            background: rgba(99, 102, 241, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-question {
            font-size: 15px;
            font-weight: 600;
            color: #c7d2fe;
        }

        .item-meta {
            font-size: 12px;
            color: #666;
        }

        .item-body {
            padding: 0;
        }

        /* Answer text lines */
        .answer-line {
            padding: 2px 24px;
            font-size: 13.5px;
            line-height: 1.7;
            color: #ccc;
            position: relative;
            transition: background 0.15s;
        }

        .answer-line:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .answer-line.empty {
            height: 8px;
        }

        /* Heading lines */
        .answer-line.heading-1 {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            padding-top: 16px;
            padding-bottom: 8px;
        }

        .answer-line.heading-2 {
            font-size: 15px;
            font-weight: 600;
            color: #e0e7ff;
            padding-top: 12px;
            padding-bottom: 6px;
        }

        .answer-line.heading-3 {
            font-size: 14px;
            font-weight: 500;
            color: #c7d2fe;
            padding-top: 8px;
            padding-bottom: 4px;
        }

        /* Split marker */
        .split-marker {
            position: relative;
            border-top: 2.5px solid #f43f5e;
            margin: 0;
        }

        .split-marker::before {
            content: attr(data-split-title);
            position: absolute;
            top: -11px;
            left: 24px;
            background: #f43f5e;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 4px;
            white-space: nowrap;
            z-index: 10;
        }

        .split-marker::after {
            content: attr(data-split-idx);
            position: absolute;
            top: -11px;
            right: 24px;
            background: rgba(244, 63, 94, 0.2);
            color: #fda4af;
            font-size: 10px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Table in content */
        .answer-line.table-row {
            font-family: 'Inter', monospace;
            font-size: 12px;
            color: #aaa;
        }

        /* Summary section */
        .summary {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .summary h2 {
            font-size: 16px;
            color: #a5b4fc;
            margin-bottom: 12px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .summary-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .summary-item .value {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }

        .summary-item .label {
            font-size: 12px;
            color: #7c82ab;
            margin-top: 4px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📄 문단 <span>분할 비교</span> 뷰어</h1>
        <div class="controls">
            <select id="fileSelect">
                <option value="">파일을 선택하세요...</option>
            </select>
            <span class="stats-badge" id="statsBadge">전체: 0개 파일</span>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot split"></div>
                    <span>분할 지점</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot heading" style="background:#6366f1"></div>
                    <span>헤딩</span>
                </div>
            </div>
        </div>
    </div>

    <div class="content" id="content">
        <div class="loading">👆 상단에서 파일을 선택하면 원본 문서와 분할 지점이 표시됩니다.</div>
    </div>

    <script>
        // 파일 구조 정의
        const FILE_LIST = [
            'advanced/interior.json',
            'advanced/medical-device-beauty.json',
            'advanced/medical-device-dental.json',
            'advanced/medical-device-internal.json',
            'advanced/medical-device-pain.json',
            'advanced/signage.json',
            'checklist/facilities.json',
            'checklist/general.json',
            'checklist/regulations.json',
            'hospital-basics/during-construction/furniture.json',
            'hospital-basics/during-construction/infrastructure.json',
            'hospital-basics/during-construction/textiles.json',
            'hospital-basics/during-construction/waste.json',
            'hospital-basics/post-opening/admin.json',
            'hospital-basics/post-opening/emr-crm.json',
            'hospital-basics/post-opening/management.json',
            'hospital-basics/post-opening/pharmacy.json',
            'hospital-basics/pre-construction/demolition.json',
            'hospital-basics/pre-construction/interior.json',
            'hospital-basics/pre-construction/marketing.json',
            'hospital-basics/pre-construction/medical-device.json',
            'hospital-basics/pre-construction/signage.json',
            'hospital-basics/pre-construction/tax-loan.json',
            'hospital-opening-roadmap.json',
            'partners/post-construction/emr-crm.json',
            'partners/post-construction/furniture.json',
            'partners/post-construction/marketing.json',
            'partners/pre-construction/bank.json',
            'partners/pre-construction/homepage.json',
            'partners/pre-construction/interior.json',
            'partners/pre-construction/pc-network.json',
            'partners/pre-construction/signage.json',
            'portfolio/customers.json',
        ];

        const BASE_ORIG = 'notion/';
        const BASE_SPLIT = 'notion_rephrased/';

        // Populate file selector
        const fileSelect = document.getElementById('fileSelect');
        FILE_LIST.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f;
            opt.textContent = f;
            fileSelect.appendChild(opt);
        });
        document.getElementById('statsBadge').textContent = `전체: ${FILE_LIST.length}개 파일`;

        fileSelect.addEventListener('change', async () => {
            const file = fileSelect.value;
            if (!file) return;
            await loadComparison(file);
        });

        async function loadComparison(filePath) {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">로딩 중...</div>';

            try {
                const [origResp, splitResp] = await Promise.all([
                    fetch(BASE_ORIG + filePath),
                    fetch(BASE_SPLIT + filePath)
                ]);

                const origData = await origResp.json();
                const splitData = await splitResp.json();

                // Build split point map: for each original item, find where splits occur
                const splitItems = splitData.items || [];

                // Group split items by originalId
                const splitGroups = {};
                for (const si of splitItems) {
                    const origId = si.metadata?.originalId || si.id;
                    if (!splitGroups[origId]) splitGroups[origId] = [];
                    splitGroups[origId].push(si);
                }

                let html = '';

                // Summary
                const origCount = origData.items?.length || 0;
                const splitCount = splitData.itemCount || splitItems.length;
                html += `
      <div class="summary">
        <h2>📊 ${filePath}</h2>
        <div class="summary-grid">
          <div class="summary-item">
            <div class="value">${origCount}</div>
            <div class="label">원본 항목</div>
          </div>
          <div class="summary-item">
            <div class="value">${splitCount}</div>
            <div class="label">분할 후 항목</div>
          </div>
          <div class="summary-item">
            <div class="value">${(splitCount / origCount).toFixed(1)}x</div>
            <div class="label">분할 비율</div>
          </div>
        </div>
      </div>
    `;

                // For each original item, show the full text with split markers
                for (const item of (origData.items || [])) {
                    const splits = splitGroups[item.id] || [];

                    // Build a map of split start markers
                    // For each split paragraph, find its starting text in the original
                    const splitStartLines = [];
                    for (let si = 0; si < splits.length; si++) {
                        const sp = splits[si];
                        const firstLine = (sp.answer || '').split('\n')[0].trim();
                        if (firstLine && si > 0) { // skip first one (it's the beginning)
                            splitStartLines.push({
                                lineText: firstLine,
                                title: sp.metadata?.paragraphTitle || `문단 ${si + 1}`,
                                idx: si + 1,
                                total: splits.length
                            });
                        }
                    }

                    const answer = item.answer || '';
                    const lines = answer.split('\n');

                    html += `<div class="item-card">`;
                    html += `<div class="item-header">
        <span class="item-question">Q: ${escapeHtml(item.question || '')}</span>
        <span class="item-meta">${answer.length}자 · ${splits.length > 1 ? splits.length + '개로 분할' : '분할 없음'}</span>
      </div>`;
                    html += `<div class="item-body">`;

                    for (let li = 0; li < lines.length; li++) {
                        const line = lines[li];
                        const trimmed = line.trim();

                        // Check if this line is a split point
                        let splitInfo = null;
                        for (let si = 0; si < splitStartLines.length; si++) {
                            if (trimmed === splitStartLines[si].lineText.trim()) {
                                splitInfo = splitStartLines[si];
                                splitStartLines.splice(si, 1); // remove to avoid re-matching
                                break;
                            }
                        }

                        // Determine line class
                        let lineClass = 'answer-line';
                        if (trimmed === '') {
                            lineClass += ' empty';
                        } else if (trimmed.startsWith('# ')) {
                            lineClass += ' heading-1';
                        } else if (trimmed.startsWith('## ')) {
                            lineClass += ' heading-2';
                        } else if (trimmed.startsWith('### ')) {
                            lineClass += ' heading-3';
                        } else if (trimmed.startsWith('|')) {
                            lineClass += ' table-row';
                        }

                        if (splitInfo) {
                            lineClass += ' split-marker';
                            html += `<div class="${lineClass}" data-split-title="${escapeHtml(splitInfo.title)}" data-split-idx="P${splitInfo.idx}/${splitInfo.total}">`;
                        } else {
                            html += `<div class="${lineClass}">`;
                        }

                        html += escapeHtml(line) || '&nbsp;';
                        html += `</div>`;
                    }

                    html += `</div></div>`;
                }

                content.innerHTML = html;

            } catch (err) {
                content.innerHTML = `<div class="loading">❌ 로딩 실패: ${err.message}</div>`;
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>

</body>

</html>
