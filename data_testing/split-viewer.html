<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Notion Data Split Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #536db1;
            --bg: #f8f9fc;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-sub: #718096;
            --split-line: #ff4d4d;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 30px;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .file-section {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            margin-bottom: 50px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .file-header {
            background: var(--primary);
            color: white;
            padding: 20px 30px;
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-info {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr;
            padding: 30px;
            gap: 20px;
        }

        .original-view {
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 1rem;
            color: #4a5568;
            position: relative;
        }

        .split-block {
            padding: 20px;
            background: #fff;
            border: 2px solid #edf2f7;
            border-radius: 12px;
            margin-bottom: 20px;
            position: relative;
            transition: transform 0.2s;
        }

        .split-block:hover {
            transform: scale(1.01);
            border-color: var(--primary);
        }

        .split-tag {
            position: absolute;
            top: -10px;
            left: 20px;
            background: var(--primary);
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .split-line {
            border-top: 2px dashed var(--split-line);
            margin: 40px 0;
            position: relative;
        }

        .split-line::after {
            content: "✂️ CUT HERE (Topic Changed)";
            position: absolute;
            top: -12px;
            right: 0;
            background: var(--split-line);
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .badge {
            background: #e2e8f0;
            color: #4a5568;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-right: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>✂️ Notion Split Quality Review</h1>
        <div id="viewer"></div>
    </div>

    <script>
        fetch('viewer_data.json')
            .then(res => res.json())
            .then(data => {
                const viewer = document.getElementById('viewer');
                data.forEach(item => {
                    const section = document.createElement('div');
                    section.className = 'file-section';

                    let splitHtml = item.splits.map((s, i) => `
                        <div class="split-block">
                            <span class="split-tag">Document #${i + 1}</span>
                            <div style="font-weight: 700; margin-bottom: 10px; color: var(--primary);">Q: ${s.question}</div>
                            <div>${s.answer.replace(/\n/g, '<br>')}</div>
                        </div>
                        ${i < item.splits.length - 1 ? '<div class="split-line"></div>' : ''}
                    `).join('');

                    section.innerHTML = `
                        <div class="file-header">
                            <div>${item.originalQuestion}</div>
                            <div class="file-info">${item.fileName} • ${item.splits.length} 문단</div>
                        </div>
                        <div class="content-grid">
                            <div class="original-view">
                                ${splitHtml}
                            </div>
                        </div>
                    `;
                    viewer.appendChild(section);
                });
            });
    </script>
</body>

</html>
